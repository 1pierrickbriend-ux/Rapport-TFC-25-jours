<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TFC — Rapports de suivi</title>
<style>
:root{--dark:#2D2660;--mid:#6B5CA5;--gold:#C9A84C;--green:#22C55E;--orange:#FB923C;--red:#EF4444;--bg:#F4F3F9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh}

.header{background:linear-gradient(135deg,#2D2660 0%,#3d3480 100%);padding:16px 24px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gold)}
.header-logo{width:46px;height:46px;border-radius:50%;object-fit:contain;flex-shrink:0}
.header h1{color:white;font-size:1.1rem;font-weight:800;letter-spacing:.04em}
.header p{color:var(--gold);font-size:.72rem;margin-top:2px}
.header-clock{margin-left:auto;text-align:right;flex-shrink:0}
.clock-time{color:white;font-size:1.05rem;font-weight:700;letter-spacing:.04em;line-height:1}
.clock-date{color:var(--gold);font-size:.65rem;margin-top:2px;white-space:nowrap}

/* ONGLETS */
.tabs{background:white;border-bottom:2px solid #E5E3F5;padding:0 20px;display:flex;gap:0;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(45,38,96,.06);position:relative}
.tab-btn{padding:13px 22px;border:none;background:none;cursor:pointer;font-weight:600;font-size:.85rem;color:#888;border-bottom:3px solid transparent;transition:color .2s;white-space:nowrap;position:relative}
.tab-btn.active{color:var(--dark);font-weight:700}
.tab-indicator{position:absolute;bottom:-2px;left:0;height:3px;background:var(--dark);border-radius:2px 2px 0 0;transition:left .22s cubic-bezier(.4,0,.2,1),width .22s cubic-bezier(.4,0,.2,1)}

/* FILTRES */
.filter-bar{background:white;padding:12px 20px;border-bottom:1px solid #E5E3F5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:46px;z-index:19;box-shadow:0 2px 6px rgba(45,38,96,.04)}
.filter-label{font-size:.72rem;font-weight:700;color:var(--mid);letter-spacing:.06em;text-transform:uppercase;margin-right:4px;white-space:nowrap}
.filter-btn{padding:5px 14px;border:2px solid #DDD;border-radius:20px;background:white;cursor:pointer;font-size:.75rem;font-weight:600;color:#666;transition:.15s;white-space:nowrap}
.filter-btn:hover{border-color:var(--mid);color:var(--mid)}
.filter-btn.active{background:var(--dark);border-color:var(--dark);color:white}
.filter-info{margin-left:auto;font-size:.68rem;color:#aaa;font-style:italic}

.main{max-width:840px;margin:0 auto;padding:24px 20px}
.section{display:none}.section.active{display:block}
.section-title{font-size:.82rem;font-weight:800;color:var(--dark);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}

/* CARTES */
.report-card{background:white;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 10px rgba(45,38,96,.07);text-decoration:none;display:block;border:1.5px solid #E5E3F5;transition:transform .15s,box-shadow .15s;animation:fadeInUp .3s ease both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.report-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,38,96,.14)}
.report-card.hidden{display:none}
.card-inner{display:flex;align-items:center;gap:14px;padding:14px 18px}
.card-icon{font-size:1.3rem;flex-shrink:0}
.card-date{font-size:.95rem;font-weight:700;color:var(--dark)}
.card-meta{font-size:.68rem;color:#888;margin-top:3px;line-height:1.4}
.card-cats{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.cat-badge{font-size:.6rem;font-weight:700;color:white;padding:2px 8px;border-radius:20px}
.card-arrow{margin-left:auto;color:var(--mid);font-size:1.1rem;flex-shrink:0}
.latest-badge{background:var(--gold);color:white;font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:20px}
.nouveau-badge{background:#E91E63;color:white;font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:20px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* BILAN BADGE STATUT */
.statut-badge{font-size:.6rem;font-weight:700;color:white;padding:2px 9px;border-radius:20px}

.empty{text-align:center;padding:50px 20px;color:#aaa}
.empty-icon{font-size:2.5rem;margin-bottom:10px}
.loading{text-align:center;padding:40px;color:#aaa;font-style:italic;font-size:.85rem}
.skeleton{background:#E9E6F4;border-radius:6px;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.skeleton-card{background:white;border-radius:12px;margin-bottom:10px;padding:16px 18px;border:1.5px solid #E5E3F5;display:flex;align-items:center;gap:14px}

.footer{text-align:center;padding:28px;color:#aaa;font-size:.7rem}

@media(max-width:600px){
  .header h1{font-size:.95rem}
  .tab-btn{padding:11px 14px;font-size:.78rem}
  .card-date{font-size:.88rem}
  .card-inner{align-items:flex-start;padding:12px 14px;gap:10px}
  .card-arrow{margin-top:2px;flex-shrink:0;align-self:flex-start}
  .card-inner>div[style*="flex:1"]{min-width:0;overflow:hidden}
  .card-inner>div[style*="flex:1"] div[style*="display:flex"]{max-width:100%;flex-wrap:wrap;row-gap:4px}
  .statut-badge,.latest-badge,.nouveau-badge{white-space:nowrap}
  .cat-badge{white-space:nowrap}
}
</style>
</head>

<script>
const REPO  = '1pierrickbriend-ux/Rapport-TFC-25-jours';
const SITE  = 'https://1pierrickbriend-ux.github.io/Rapport-TFC-25-jours';
const RAW   = 'https://raw.githubusercontent.com/' + REPO + '/main';

const CAT_COLORS = {
  'N3':'#DC2626','N2':'#991B1B','N1':'#7F1D1D',
  'U19':'#1D4ED8','U18':'#1E40AF','U17':'#1E3A8A','U16':'#1D3461',
  'U23':'#6D28D9','U21':'#7C3AED',
  'CDR':'#B45309','CDF':'#92400E','PRO':'#064E3B','L2':'#065F46','FFF':'#374151'
};
const STATUT_COLORS = {'PRÊT':'#22C55E','SURVEILLANCE':'#FB923C','VIGILANCE':'#EF4444'};

function catColor(c){ for(const[k,v] of Object.entries(CAT_COLORS)) if(c.toUpperCase().includes(k)) return v; return '#374151'; }

function isNouveau(dateStr, formatDMY){
  if(!dateStr) return false;
  try{
    var d;
    if(formatDMY){
      var p=dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      if(!p) return false;
      d=new Date(p[3],p[2]-1,p[1]);
    } else {
      var p2=dateStr.match(/(\d{2})(\d{2})(\d{4})/);
      if(!p2) return false;
      d=new Date(p2[3],p2[2]-1,p2[1]);
    }
    return (Date.now()-d.getTime()) < 3*24*3600*1000; // 3 jours
  } catch(e){ return false; }
}


// ── Horloge header (prop 2) ───────────────────────────────────────────────
function updateClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  const el = document.getElementById('clock-time');
  if(el) el.textContent = hh+':'+mm+':'+ss;
  const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const el2 = document.getElementById('clock-date');
  if(el2) el2.textContent = jours[now.getDay()]+' '+now.getDate()+' '+mois[now.getMonth()];
}
updateClock();
setInterval(updateClock, 1000);
// ── État ──────────────────────────────────────────────────────────────────────
let currentTab    = localStorage.getItem('tfc_tab')    || 'rapports';
let currentFilter = {rapports: localStorage.getItem('tfc_filter_rapports')||'Tous', bilans: localStorage.getItem('tfc_filter_bilans')||'Tous'};

// ── SAISONS ──────────────────────────────────────────────────────────────────
function seasonOf(dateStr){
  const m = (dateStr||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return null;
  const mm = parseInt(m[2],10), yyyy = parseInt(m[3],10);
  return mm >= 7 ? `${yyyy}-${yyyy+1}` : `${yyyy-1}-${yyyy}`;
}
function currentSeason(){
  const now = new Date();
  const mm = now.getMonth()+1, yyyy = now.getFullYear();
  return mm >= 7 ? `${yyyy}-${yyyy+1}` : `${yyyy-1}-${yyyy}`;
}
function seasonLabel(s){
  if(!s) return '—';
  const p = s.split('-');
  return `${p[0]}/${p[1].slice(2)}`;
}
let selectedSeason = localStorage.getItem('tfc_saison') || currentSeason();
let manifest      = {};
let allCats       = new Set();
let rapportsDone  = false;
let bilansDone    = false;

// ── Logo TFC ──────────────────────────────────────────────────────────────────
async function loadLogo(){
  try{
    const r = await fetch(RAW+'/manifest.json?t='+Date.now());
    if(r.ok) manifest = await r.json();
  } catch{}
  // Logo embarqué en base64 — pas de chargement nécessaire
  populateSeasonSelect();
}

function populateSeasonSelect(){
  const sel = document.getElementById('season-select');
  if(!sel) return;
  const cur = currentSeason();
  const seasons = new Set([cur]);
  Object.values(manifest).forEach(v=>{ if(v.saison) seasons.add(v.saison); });
  const sorted = [...seasons].sort().reverse();
  sel.innerHTML = sorted.map(s=>{
    const tag = s===cur ? ' (en cours)' : ' (archives)';
    return `<option value="${s}"${s===selectedSeason?' selected':''}>${seasonLabel(s)}${tag}</option>`;
  }).join('');
}

function onSeasonChange(v){
  selectedSeason = v;
  localStorage.setItem('tfc_saison', v);
  rapportsDone = false; bilansDone = false;
  loadRapports();
  if(currentTab==='bilans') loadBilans();
}

// ── Bannière statut du jour ────────────────────────────────────────────────
async function buildBanner(){
  const banner = document.getElementById('banner-statut');
  if(!banner) return;
  try{
    const saisonEnCours = currentSeason();
    // Bilans saison : comptage informatif uniquement (finalité de fin de protocole), saison en cours seulement
    const bkeys = Object.keys(manifest).filter(k=>manifest[k].type==='bilan' && manifest[k].saison===saisonEnCours);
    const bilansTermines = bkeys.length;

    // Dernier rapport collectif publié + ses statuts par joueur (état du jour), saison en cours seulement
    const rkeys = Object.keys(manifest).filter(k=>(!manifest[k].type||manifest[k].type!=='bilan') && manifest[k].saison===saisonEnCours);
    let dernierRapportKey = null, dernierRapportSort = '0', dernierRapport = '—';
    rkeys.forEach(k=>{
      const d = manifest[k].date||'';
      const s = sortDateDMY(d);
      if(d && s > dernierRapportSort){ dernierRapportSort = s; dernierRapport = d; dernierRapportKey = k; }
    });
    const rapportStatuts = dernierRapportKey ? (manifest[dernierRapportKey].statuts || null) : null;

    // Footer fonctionnel
    const footerEl = document.getElementById('footer-bar');
    if(footerEl){
      const nBilans = bkeys.length;
      const nRapports = rkeys.length;
      footerEl.innerHTML = 'Cellule Performance &amp; R&eacute;athl&eacute;tisation &middot; TFC'
        + (nRapports ? ' &middot; ' + nRapports + ' rapport' + (nRapports>1?'s':'') : '')
        + (nBilans  ? ' &middot; ' + nBilans  + ' bilan'   + (nBilans>1?'s':'')   : '')
        + (dernierRapport!=='—' ? ' &middot; Dernier rapport : ' + dernierRapport : '')
        + ' &middot; <a href="' + SITE + '/admin.html" target="_blank" style="color:var(--mid);font-weight:600;text-decoration:none">Admin</a>';
    }

    const kpiCard = (val, label, bg, col, textCol) =>
      `<div style="background:${bg};border-radius:10px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;min-width:72px;flex-shrink:0;border:1.5px solid ${col}20">
        <span style="font-size:1.5rem;font-weight:800;color:${textCol};line-height:1">${val}</span>
        <span style="font-size:.58rem;font-weight:700;color:${textCol};letter-spacing:.04em;margin-top:3px;text-transform:uppercase">${label}</span>
      </div>`;

    // Groupe 1 : bilans saison — comptage informatif, pas un statut du jour
    let html = `<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
        <span style="font-size:.56rem;font-weight:700;color:#aaa;letter-spacing:.06em;text-transform:uppercase;padding-left:2px">Saison</span>
        <div style="display:flex;gap:8px">${kpiCard(bilansTermines, 'Bilans', '#F0EEF8', '#6B5CA5', '#2D2660')}</div>
      </div>`;

    // Groupe 2 : statuts du dernier rapport publié — l'état réel du jour
    html += `<div style="width:1.5px;align-self:stretch;background:#E5E3F5;flex-shrink:0"></div>`;
    if(rapportStatuts){
      const pret = rapportStatuts['PRÊT']||0, surv = rapportStatuts['SURVEILLANCE']||0, vigil = rapportStatuts['VIGILANCE']||0;
      html += `<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
          <span style="font-size:.56rem;font-weight:700;color:#aaa;letter-spacing:.06em;text-transform:uppercase;padding-left:2px">Rapport du ${dernierRapport}</span>
          <div style="display:flex;gap:8px;flex-wrap:wrap">`
        + (vigil>0 ? kpiCard(vigil, 'Vigilance', '#FEE2E2', '#EF4444', '#B91C1C') : '')
        + (surv>0  ? kpiCard(surv,  'Surveillance', '#FFEDD5', '#FB923C', '#C2410C') : '')
        + (pret>0  ? kpiCard(pret,  'Prêt', '#DCFCE7', '#22C55E', '#15803D') : '')
        + (vigil===0 && surv===0 && pret>0 ?
            '<div style="background:#DCFCE7;border:1.5px solid #22C55E20;border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:6px;flex-shrink:0">' +
              '<span style="font-size:.95rem">✓</span>' +
              '<span style="font-size:.72rem;font-weight:700;color:#15803D">Aucune vigilance</span>' +
            '</div>' : '')
        + `</div>
        </div>`;
    } else {
      html += `<div style="display:flex;align-items:center;gap:6px;font-size:.75rem;color:#aaa;font-style:italic">Aucun rapport publié pour la saison ${seasonLabel(saisonEnCours)}</div>`;
    }

    banner.innerHTML = html;
  } catch(e){
    banner.innerHTML='<div style="color:#aaa;font-size:.75rem">Statut indisponible</div>';
  }
}

// ── Onglets ───────────────────────────────────────────────────────────────────
function showTab(tab){
  currentTab = tab;
  localStorage.setItem('tfc_tab', tab);
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', (i===0&&tab==='rapports')||(i===1&&tab==='bilans'));
  });
  document.getElementById('section-rapports').classList.toggle('active', tab==='rapports');
  document.getElementById('section-bilans').classList.toggle('active', tab==='bilans');
  // Indicateur glissant (prop 6)
  const activeBtn = document.querySelector('.tab-btn.active');
  const ind = document.getElementById('tab-indicator');
  if(ind && activeBtn){ ind.style.left=activeBtn.offsetLeft+'px'; ind.style.width=activeBtn.offsetWidth+'px'; }
  if(tab==='bilans' && !bilansDone) loadBilans();
  buildBanner();
  applyFilter();
}

// ── Filtres ───────────────────────────────────────────────────────────────────
function buildFilterButtons(){
  const container = document.getElementById('filter-cats');
  container.innerHTML = '';
  const cf = currentFilter[currentTab]||'Tous';
  const filterBar = document.getElementById('filter-bar');
  if(filterBar) filterBar.style.display = allCats.size <= 1 ? 'none' : '';
  // Compter items par catégorie selon onglet actif (prop 8)
  const catCounts = {};
  if(currentTab === 'rapports'){
    Object.keys(manifest).filter(k=>!manifest[k].type||manifest[k].type!=='bilan').forEach(k=>{
      (manifest[k].categories||[]).forEach(c=>{ catCounts[c]=(catCounts[c]||0)+1; });
    });
  } else {
    Object.keys(manifest).filter(k=>manifest[k].type==='bilan').forEach(k=>{
      const c = manifest[k].cat||''; if(c) catCounts[c]=(catCounts[c]||0)+1;
    });
  }
  [...allCats].sort().forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cf===cat?' active':'');
    const n = catCounts[cat]||0;
    btn.innerHTML = cat + (n ? ' <span style="font-size:.6rem;opacity:.75;font-weight:400">('+n+')</span>' : '');
    btn.onclick = ()=>setFilter(cat);
    container.appendChild(btn);
  });
  document.querySelector('.filter-btn').className = 'filter-btn' + (cf==='Tous'?' active':'');
}

function setFilter(cat){
  currentFilter[currentTab] = cat;
  localStorage.setItem('tfc_filter_'+currentTab, cat);
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent===cat);
  });
  applyFilter();
}

function applyFilter(){
  const tab = currentTab;
  const listId = tab==='rapports' ? 'rapports-list' : 'bilans-list';
  const cards  = document.querySelectorAll('#'+listId+' .report-card');
  let visible  = 0;
  cards.forEach(card=>{
    const cats = (card.dataset.cats||'').split(',').filter(c=>c&&c!=='—');
    // Si pas de catégorie connue → visible pour tous les filtres
    const cf = currentFilter[tab]||'Tous';
    const show = cf==='Tous' || cats.length===0 || cats.includes(cf);
    card.classList.toggle('hidden', !show);
    if(show) visible++;
  });
  const info = document.getElementById('filter-info');
  const cfInfo = currentFilter[tab]||'Tous';
  if(cfInfo!=='Tous') info.textContent = visible + ' résultat' + (visible>1?'s':'') + ' pour ' + cfInfo;
  else info.textContent = '';
}

// ── Tri par date DDMMYYYY → YYYYMMDD ─────────────────────────────────────────
function sortDate(name){
  const m = name.match(/(\d{2})(\d{2})(\d{4})/);
  return m ? m[3]+m[2]+m[1] : '0';
}
function sortDateDMY(dmy){
  if(!dmy) return '0';
  const m = dmy.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? m[3]+m[2]+m[1] : '0';
}


function relativeAge(dateStr){
  const m = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return '';
  const d = new Date(m[3], m[2]-1, m[1]); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((today-d)/(1000*60*60*24));
  if(days===0) return "aujourd'hui";
  if(days===1) return 'hier';
  if(days<7) return `il y a ${days} jours`;
  if(days<14) return 'il y a 1 semaine';
  return `il y a ${Math.round(days/7)} semaines`;
}
function ageColor(dateStr){
  const m = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return '#aaa';
  const d = new Date(m[3], m[2]-1, m[1]); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((today-d)/(1000*60*60*24));
  if(days<=7) return '#22C55E';
  if(days<=14) return '#FB923C';
  return '#EF4444';
}
// ── Rapports ──────────────────────────────────────────────────────────────────
async function loadRapports(){
  const list = document.getElementById('rapports-list');
  list.innerHTML = '<div class="skeleton-card"><div class="skeleton" style="width:32px;height:32px;border-radius:8px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="height:14px;width:55%;margin-bottom:8px"></div><div class="skeleton" style="height:10px;width:35%"></div></div></div>'.repeat(3);
  try{
    const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/rapports',
      {headers:{Accept:'application/vnd.github.v3+json'}});
    if(r.status===403) throw new Error('Accès refusé (rate limit GitHub ou repo privé). Réessayez dans quelques minutes.');
    if(r.status===404) throw new Error('Dossier rapports introuvable sur le dépôt.');
    if(!r.ok) throw new Error('Erreur GitHub (code ' + r.status + '). Réessayez.');
    const files = await r.json();
    const htmlFiles = files.filter(f=>f.name.endsWith('.html'))
      .filter(f=>{
        const s = (manifest[f.name]||{}).saison;
        return s ? s===selectedSeason : selectedSeason===currentSeason();
      })
      .sort((a,b)=>sortDate(b.name).localeCompare(sortDate(a.name)));
    allCats = new Set();
    if(!htmlFiles.length){
      list.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><p>Aucun rapport pour la saison ${seasonLabel(selectedSeason)}.</p></div>`;
      buildFilterButtons(); applyFilter();
      return;
    }
    list.innerHTML='';
    htmlFiles.forEach((file,idx)=>{
      const info  = manifest[file.name]||{};
      const date  = info.date || file.name.replace('rapport_','').replace('.html','').replace(/(\d{2})(\d{2})(\d{4})/,'$1/$2/$3');
      const cats  = info.categories||[];
      const players = info.players||'';
      const url   = SITE+'/rapports/'+file.name;
      cats.forEach(c=>allCats.add(c));
      const catBadges = cats.map(c=>`<span class="cat-badge" style="background:${catColor(c)}">${c}</span>`).join('');
      const age = relativeAge(date);
      const agecol = ageColor(date);
      const card = document.createElement('a');
      card.className = 'report-card';
      card.href = url; card.target = '_blank';
      card.dataset.cats = cats.join(',');
      card.style.borderLeft = '4px solid ' + agecol;
      card.innerHTML = `<div class="card-inner">
        <div class="card-icon" style="width:32px;height:32px;border-radius:8px;background:var(--mid);display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0">📋</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="card-date">Entretiens du ${date}</span>
            ${idx===0?'<span class="latest-badge">Dernier rapport</span>':''}
            <span style="font-size:.65rem;font-weight:600;color:${agecol}">${age}</span>
            ${isNouveau(file.name,false)?'<span class="latest-badge" style="background:#E91E63">🔴 Nouveau</span>':''}
          </div>
          <div class="card-meta">${players?players+' joueur'+(players>1?'s':''):''}${players&&cats.length?' · ':''}${cats.length?'Catégories :':''}</div>
          ${cats.length?`<div class="card-cats">${catBadges}</div>`:''}
        </div>
        <div class="card-arrow">›</div>
      </div>`;
      list.appendChild(card);
    });
    rapportsDone = true;
    // Compteur global rapports (prop 3)
    const titleEl = document.querySelector('#section-rapports .section-title');
    if(titleEl){
      const oldest = htmlFiles.length ? (()=>{
        const info = manifest[htmlFiles[htmlFiles.length-1].name]||{};
        return info.date || '';
      })() : '';
      titleEl.innerHTML = 'Rapports collectifs'
        + '<span style="font-size:.68rem;font-weight:400;color:#888;margin-left:8px;text-transform:none;letter-spacing:0">'
        + htmlFiles.length + ' rapport' + (htmlFiles.length>1?'s':'')
        + (oldest ? ' · depuis le ' + oldest : '')
        + '</span>';
    }
    buildFilterButtons();
    applyFilter();
  } catch(e){
    list.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`;
  }
}

// ── Bilans ────────────────────────────────────────────────────────────────────
async function loadBilans(){
  const list = document.getElementById('bilans-list');
  list.innerHTML = '<div class="skeleton-card"><div class="skeleton" style="width:32px;height:32px;border-radius:8px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="height:14px;width:55%;margin-bottom:8px"></div><div class="skeleton" style="height:10px;width:35%"></div></div></div>'.repeat(3);
  try{
    const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/bilans',
      {headers:{Accept:'application/vnd.github.v3+json'}});
    if(r.status===403) throw new Error('Accès refusé (rate limit GitHub). Réessayez dans quelques minutes.');
    if(r.status===404) throw new Error('Aucun bilan publié pour le moment.');
    if(!r.ok) throw new Error('Erreur GitHub (code ' + r.status + '). Réessayez.');
    const files = await r.json();
    const htmlFiles = files.filter(f=>f.name.endsWith('.html'))
      .filter(f=>{
        const s = (manifest['bilan_'+f.name]||{}).saison;
        return s ? s===selectedSeason : selectedSeason===currentSeason();
      })
      .sort((a,b)=>{
        const SORD={'VIGILANCE':0,'SURVEILLANCE':1,'PRÊT':2,'':3};
        const ia=manifest['bilan_'+a.name]||{}, ib=manifest['bilan_'+b.name]||{};
        const sa=SORD[ia.statut??'']??3, sb=SORD[ib.statut??'']??3;
        if(sa!==sb) return sa-sb;
        return sortDateDMY(ib.date).localeCompare(sortDateDMY(ia.date));
      });
    allCats = new Set();
    if(!htmlFiles.length){
      list.innerHTML=`<div class="empty"><div class="empty-icon">👤</div><p>Aucun bilan pour la saison ${seasonLabel(selectedSeason)}.</p></div>`;
      buildFilterButtons(); applyFilter();
      return;
    }
    list.innerHTML='';
    htmlFiles.forEach(file=>{
      const key    = 'bilan_'+file.name;
      const info   = manifest[key]||{};
      const joueur = info.joueur || file.name.replace('Bilan_','').replace('.html','').replace(/_/g,' ');
      const cat    = info.cat   || '';
      const statut = info.statut|| '';
      const rri    = info.rri   || '';
      const date   = info.date  || '';
      const jp     = info.jp !== undefined && info.jp !== '' ? parseInt(info.jp) : null;
      const pct    = jp !== null ? Math.min(100, Math.round(jp/25*100)) : null;
      const url    = SITE+'/bilans/'+file.name;
      if(cat) allCats.add(cat);
      const sc = STATUT_COLORS[statut]||'#6B5CA5';
      // Badge fin protocole : prochain vendredi après J+25
      let badgeFinProto = '';
      const dfp = info.dateFinProto||'';
      if(dfp){
        const pm = dfp.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        if(pm){
          const today = new Date(); today.setHours(0,0,0,0);
          const dFin = new Date(pm[3], pm[2]-1, pm[1]); dFin.setHours(0,0,0,0);
          if(dFin >= today){
            // Prochain vendredi >= dFin
            const vendr = new Date(dFin);
            const dow = vendr.getDay(); // 0=dim,5=ven
            const diff = (5 - dow + 7) % 7;
            vendr.setDate(vendr.getDate() + diff);
            const jj = String(vendr.getDate()).padStart(2,'0');
            const mm = String(vendr.getMonth()+1).padStart(2,'0');
            badgeFinProto = `<span class="statut-badge" style="background:#7C3AED">&#128197; Bilan ~vendredi ${jj}/${mm}</span>`;
          }
        }
      }
      const borderCol = statut==='VIGILANCE'?'#EF4444':statut==='SURVEILLANCE'?'#FB923C':statut==='PRÊT'?'#22C55E':'#E5E3F5';
      const card = document.createElement('a');
      card.className = 'report-card';
      card.href = url; card.target = '_blank';
      card.dataset.cats = cat;
      card.style.borderLeft = '4px solid ' + borderCol;
      card.style.animationDelay = (Array.from(card.parentNode?.children||[]).length * 40) + 'ms';
      const initiales = joueur.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
      const photoName = joueur.replace(/ /g,'_');
      const photoExts = ['jpg','jpeg','png','JPG','PNG'];
      const photoUrl = SITE+'/photos/'+photoName+'.jpg';
      const photoHtml = `<div style="width:40px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--mid);display:flex;align-items:center;justify-content:center">
        <img src="${photoUrl}" alt="${joueur}" style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block"
          onerror="this.style.display='none';this.parentNode.innerHTML='<span style=\\'font-size:11px;font-weight:700;color:white\\'>${initiales}</span>'">
      </div>`;
      card.innerHTML = `<div class="card-inner">
        ${photoHtml}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="card-date">${joueur}</span>
            ${statut?`<span class="statut-badge" style="background:${sc}">${statut}</span>`:''}
            ${badgeFinProto}
            ${isNouveau(date,true)?'<span class="statut-badge" style="background:#E91E63">🔴 Nouveau</span>':''}
          </div>
          <div class="card-meta">${[cat, rri?'RRI '+rri+'/100':'', date?'Bilan du '+date:''].filter(Boolean).join(' · ')}</div>
          ${pct!==null?`<div style="margin-top:6px;display:flex;align-items:center;gap:6px">
            <div style="flex:1;height:4px;background:#E9E6F4;border-radius:4px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:${statut==='VIGILANCE'?'#EF4444':statut==='SURVEILLANCE'?'#FB923C':'#22C55E'};border-radius:4px;transition:width .4s ease"></div>
            </div>
            <span style="font-size:.6rem;font-weight:700;color:#888;flex-shrink:0">J+${jp}/25</span>
          </div>`:''}
        </div>
        <div class="card-arrow">›</div>
      </div>`;
      list.appendChild(card);
    });
    bilansDone = true;
    buildFilterButtons();
    applyFilter();
  } catch(e){
    list.innerHTML=`<div class="empty"><div class="empty-icon">👤</div><p>${e.message}</p></div>`;
  }
}
