<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TFC — Rapports de suivi</title>
<style>
:root{--dark:#2D2660;--mid:#6B5CA5;--gold:#C9A84C;--green:#22C55E;--orange:#FB923C;--red:#EF4444;--bg:#EEEAF6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh}

.header{background:var(--dark);padding:16px 24px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gold)}
.header-logo{width:46px;height:46px;border-radius:50%;object-fit:contain;flex-shrink:0}
.header h1{color:white;font-size:1.1rem;font-weight:800;letter-spacing:.04em}
.header p{color:var(--gold);font-size:.72rem;margin-top:2px}

/* ONGLETS */
.tabs{background:white;border-bottom:2px solid #E5E3F5;padding:0 20px;display:flex;gap:0;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(45,38,96,.06)}
.tab-btn{padding:13px 22px;border:none;background:none;cursor:pointer;font-weight:600;font-size:.85rem;color:#888;border-bottom:3px solid transparent;transition:.15s;white-space:nowrap}
.tab-btn.active{color:var(--dark);border-bottom:3px solid var(--dark);font-weight:700}

/* FILTRES */
.filter-bar{background:white;padding:12px 20px;border-bottom:1px solid #E5E3F5;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-label{font-size:.72rem;font-weight:700;color:var(--mid);letter-spacing:.06em;text-transform:uppercase;margin-right:4px;white-space:nowrap}
.filter-btn{padding:5px 14px;border:2px solid #DDD;border-radius:20px;background:white;cursor:pointer;font-size:.75rem;font-weight:600;color:#666;transition:.15s;white-space:nowrap}
.filter-btn:hover{border-color:var(--mid);color:var(--mid)}
.filter-btn.active{background:var(--dark);border-color:var(--dark);color:white}
.filter-info{margin-left:auto;font-size:.68rem;color:#aaa;font-style:italic}

.main{max-width:820px;margin:0 auto;padding:24px 18px}
.section{display:none}.section.active{display:block}
.section-title{font-size:.78rem;font-weight:800;color:var(--dark);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}

/* CARTES */
.report-card{background:white;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 10px rgba(45,38,96,.07);text-decoration:none;display:block;border:1.5px solid #E5E3F5;transition:transform .15s,box-shadow .15s}
.report-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,38,96,.14)}
.report-card.hidden{display:none}
.card-inner{display:flex;align-items:center;gap:14px;padding:14px 18px}
.card-icon{font-size:1.3rem;flex-shrink:0}
.card-date{font-size:.98rem;font-weight:700;color:var(--dark)}
.card-meta{font-size:.7rem;color:#888;margin-top:3px}
.card-cats{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.cat-badge{font-size:.6rem;font-weight:700;color:white;padding:2px 8px;border-radius:20px}
.card-arrow{margin-left:auto;color:var(--mid);font-size:1.1rem;flex-shrink:0}
.latest-badge{background:var(--gold);color:white;font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:20px}

/* BILAN BADGE STATUT */
.statut-badge{font-size:.6rem;font-weight:700;color:white;padding:2px 9px;border-radius:20px}

.empty{text-align:center;padding:50px 20px;color:#aaa}
.empty-icon{font-size:2.5rem;margin-bottom:10px}
.loading{text-align:center;padding:40px;color:#aaa;font-style:italic;font-size:.85rem}
.footer{text-align:center;padding:28px;color:#aaa;font-size:.7rem}

@media(max-width:600px){
  .header h1{font-size:.95rem}
  .tab-btn{padding:11px 14px;font-size:.78rem}
  .card-date{font-size:.88rem}
}
</style>
</head>
<body>

<div class="header">
  <img id="tfc-logo" class="header-logo" src="" alt="TFC"/>
  <div>
    <h1>TOULOUSE FOOTBALL CLUB</h1>
    <p>Cellule Performance & Réathlétisation — Suivi de reprise</p>
  </div>
</div>

<!-- ONGLETS -->
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('rapports')">📋 Rapports collectifs</button>
  <button class="tab-btn" onclick="showTab('bilans')">👤 Bilans individuels</button>
</div>

<!-- FILTRE COMMUN -->
<div class="filter-bar" id="filter-bar">
  <span class="filter-label">🔍 Catégorie</span>
  <button class="filter-btn active" onclick="setFilter('Tous')">Tous</button>
  <div id="filter-cats" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <span class="filter-info" id="filter-info"></span>
</div>

<div class="main">
  <!-- RAPPORTS -->
  <div class="section active" id="section-rapports">
    <div class="section-title">Rapports collectifs</div>
    <div id="rapports-list"><div class="loading">Chargement...</div></div>
  </div>
  <!-- BILANS -->
  <div class="section" id="section-bilans">
    <div class="section-title">Bilans individuels</div>
    <div id="bilans-list"><div class="loading">Chargement...</div></div>
  </div>
</div>

<div class="footer">Cellule Performance & Réathlétisation · Toulouse Football Club</div>

<script>
const REPO  = '1pierrickbriend-ux/Rapport-TFC-25-jours';
const SITE  = 'https://1pierrickbriend-ux.github.io/Rapport-TFC-25-jours';
const RAW   = 'https://raw.githubusercontent.com/' + REPO + '/main';

const CAT_COLORS = {
  'N3':'#DC2626','N2':'#991B1B','N1':'#7F1D1D',
  'U19':'#1D4ED8','U18':'#1E40AF','U17':'#1E3A8A','U16':'#1D3461',
  'U23':'#6D28D9','U21':'#7C3AED',
  'CDR':'#B45309','CDF':'#92400E','PRO':'#064E3B','L2':'#065F46','FFF':'#374151'
};
const STATUT_COLORS = {'PRÊT':'#22C55E','SURVEILLANCE':'#FB923C','VIGILANCE':'#EF4444'};

function catColor(c){ for(const[k,v] of Object.entries(CAT_COLORS)) if(c.toUpperCase().includes(k)) return v; return '#374151'; }

// ── État ──────────────────────────────────────────────────────────────────────
let currentTab    = localStorage.getItem('tfc_tab')    || 'rapports';
let currentFilter = localStorage.getItem('tfc_filter') || 'Tous';
let manifest      = {};
let allCats       = new Set();
let rapportsDone  = false;
let bilansDone    = false;

// ── Logo TFC ──────────────────────────────────────────────────────────────────
async function loadLogo(){
  try{
    const r = await fetch(RAW+'/manifest.json?t='+Date.now());
    if(r.ok) manifest = await r.json();
  } catch{}
  // Logo depuis manifest ou direct
  const logoEl = document.getElementById('tfc-logo');
  logoEl.onerror = function(){ this.style.display='none'; };
}

// ── Onglets ───────────────────────────────────────────────────────────────────
function showTab(tab){
  currentTab = tab;
  localStorage.setItem('tfc_tab', tab);
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', (i===0&&tab==='rapports')||(i===1&&tab==='bilans'));
  });
  document.getElementById('section-rapports').classList.toggle('active', tab==='rapports');
  document.getElementById('section-bilans').classList.toggle('active', tab==='bilans');
  if(tab==='bilans' && !bilansDone) loadBilans();
  applyFilter();
}

// ── Filtres ───────────────────────────────────────────────────────────────────
function buildFilterButtons(){
  const container = document.getElementById('filter-cats');
  container.innerHTML = '';
  [...allCats].sort().forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (currentFilter===cat?' active':'');
    btn.textContent = cat;
    btn.onclick = ()=>setFilter(cat);
    container.appendChild(btn);
  });
  document.querySelector('.filter-btn').className = 'filter-btn' + (currentFilter==='Tous'?' active':'');
}

function setFilter(cat){
  currentFilter = cat;
  localStorage.setItem('tfc_filter', cat);
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent===cat);
  });
  applyFilter();
}

function applyFilter(){
  const tab = currentTab;
  const listId = tab==='rapports' ? 'rapports-list' : 'bilans-list';
  const cards  = document.querySelectorAll('#'+listId+' .report-card');
  let visible  = 0;
  cards.forEach(card=>{
    const cats = (card.dataset.cats||'').split(',');
    const show = currentFilter==='Tous' || cats.includes(currentFilter);
    card.classList.toggle('hidden', !show);
    if(show) visible++;
  });
  const info = document.getElementById('filter-info');
  if(currentFilter!=='Tous') info.textContent = visible + ' résultat' + (visible>1?'s':'') + ' pour ' + currentFilter;
  else info.textContent = '';
}

// ── Tri par date DDMMYYYY → YYYYMMDD ─────────────────────────────────────────
function sortDate(name){
  const m = name.match(/(\d{2})(\d{2})(\d{4})/);
  return m ? m[3]+m[2]+m[1] : '0';
}
function sortDateDMY(dmy){
  if(!dmy) return '0';
  const m = dmy.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? m[3]+m[2]+m[1] : '0';
}

// ── Rapports ──────────────────────────────────────────────────────────────────
async function loadRapports(){
  const list = document.getElementById('rapports-list');
  try{
    const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/rapports',
      {headers:{Accept:'application/vnd.github.v3+json'}});
    if(!r.ok) throw new Error('Dossier rapports introuvable');
    const files = await r.json();
    const htmlFiles = files.filter(f=>f.name.endsWith('.html'))
      .sort((a,b)=>sortDate(b.name).localeCompare(sortDate(a.name)));
    if(!htmlFiles.length){
      list.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>Aucun rapport disponible.</p></div>'; return;
    }
    list.innerHTML='';
    htmlFiles.forEach((file,idx)=>{
      const info  = manifest[file.name]||{};
      const date  = info.date || file.name.replace('rapport_','').replace('.html','').replace(/(\d{2})(\d{2})(\d{4})/,'$1/$2/$3');
      const cats  = info.categories||[];
      const players = info.players||'';
      const url   = SITE+'/rapports/'+file.name;
      cats.forEach(c=>allCats.add(c));
      const catBadges = cats.map(c=>`<span class="cat-badge" style="background:${catColor(c)}">${c}</span>`).join('');
      const card = document.createElement('a');
      card.className = 'report-card';
      card.href = url; card.target = '_blank';
      card.dataset.cats = cats.join(',');
      card.innerHTML = `<div class="card-inner">
        <div class="card-icon">📋</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="card-date">Entretiens du ${date}</span>
            ${idx===0?'<span class="latest-badge">Dernier rapport</span>':''}
          </div>
          <div class="card-meta">${players?players+' joueur'+(players>1?'s':''):''}${players&&cats.length?' · ':''}${cats.length?'Catégories :':''}</div>
          ${cats.length?`<div class="card-cats">${catBadges}</div>`:''}
        </div>
        <div class="card-arrow">›</div>
      </div>`;
      list.appendChild(card);
    });
    rapportsDone = true;
    buildFilterButtons();
    applyFilter();
  } catch(e){
    list.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`;
  }
}

// ── Bilans ────────────────────────────────────────────────────────────────────
async function loadBilans(){
  const list = document.getElementById('bilans-list');
  list.innerHTML = '<div class="loading">Chargement...</div>';
  try{
    const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/bilans',
      {headers:{Accept:'application/vnd.github.v3+json'}});
    if(!r.ok) throw new Error('Aucun bilan publié pour le moment.');
    const files = await r.json();
    const htmlFiles = files.filter(f=>f.name.endsWith('.html'))
      .sort((a,b)=>{
        const ia=manifest['bilan_'+a.name]||{}, ib=manifest['bilan_'+b.name]||{};
        return sortDateDMY(ib.date).localeCompare(sortDateDMY(ia.date));
      });
    if(!htmlFiles.length){
      list.innerHTML='<div class="empty"><div class="empty-icon">👤</div><p>Aucun bilan publié.</p></div>'; return;
    }
    list.innerHTML='';
    htmlFiles.forEach(file=>{
      const key    = 'bilan_'+file.name;
      const info   = manifest[key]||{};
      const joueur = info.joueur || file.name.replace('Bilan_','').replace('.html','').replace(/_/g,' ');
      const cat    = info.cat   || '';
      const statut = info.statut|| '';
      const rri    = info.rri   || '';
      const date   = info.date  || '';
      const url    = SITE+'/bilans/'+file.name;
      if(cat) allCats.add(cat);
      const sc = STATUT_COLORS[statut]||'#6B5CA5';
      const card = document.createElement('a');
      card.className = 'report-card';
      card.href = url; card.target = '_blank';
      card.dataset.cats = cat;
      card.innerHTML = `<div class="card-inner">
        <div class="card-icon">👤</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="card-date">${joueur}</span>
            ${statut?`<span class="statut-badge" style="background:${sc}">${statut}</span>`:''}
          </div>
          <div class="card-meta">${[cat, rri?'RRI '+rri+'/100':'', date?'Bilan du '+date:''].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="card-arrow">›</div>
      </div>`;
      list.appendChild(card);
    });
    bilansDone = true;
    buildFilterButtons();
    applyFilter();
  } catch(e){
    list.innerHTML=`<div class="empty"><div class="empty-icon">👤</div><p>${e.message}</p></div>`;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('load', async()=>{
  await loadLogo();
  showTab(currentTab);
  await loadRapports();
  if(currentTab==='bilans') await loadBilans();
});
</script>
</body>
</html>
