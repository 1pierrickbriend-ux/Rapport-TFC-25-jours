<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TFC — Rapports de suivi</title>
<style>
:root{--dark:#2D2660;--mid:#6B5CA5;--gold:#C9A84C;--green:#22C55E;--orange:#FB923C;--red:#EF4444;--bg:#EEEAF6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh}

.header{background:var(--dark);padding:20px 28px;display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--gold)}
.header-logo{width:50px;height:50px;border-radius:50%;background:var(--mid);display:flex;align-items:center;justify-content:center;font-weight:800;color:white;font-size:.7rem;text-align:center;border:2px solid var(--gold)}
.header h1{color:white;font-size:1.15rem;font-weight:800;letter-spacing:.04em}
.header p{color:var(--gold);font-size:.75rem;margin-top:2px}

.main{max-width:800px;margin:0 auto;padding:32px 20px}
.section-title{font-size:.8rem;font-weight:800;color:var(--dark);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}

.loading{text-align:center;padding:60px;color:#aaa;font-style:italic}
.error{background:#FEE2E2;border:1px solid var(--red);border-radius:10px;padding:20px;color:var(--red);text-align:center}

.report-card{background:white;border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 12px rgba(45,38,96,.08);transition:transform .15s,box-shadow .15s;text-decoration:none;display:block;border:1.5px solid #E5E3F5}
.report-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,38,96,.15)}
.report-card-inner{display:flex;align-items:center;gap:16px;padding:16px 20px}
.report-icon{width:44px;height:44px;border-radius:10px;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.2rem}
.report-date{font-size:1rem;font-weight:700;color:var(--dark)}
.report-meta{font-size:.72rem;color:#888;margin-top:3px}
.report-cats{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.cat-badge{font-size:.6rem;font-weight:700;color:white;padding:2px 8px;border-radius:20px}
.report-arrow{margin-left:auto;color:var(--mid);font-size:1.2rem;flex-shrink:0}
.latest-badge{background:var(--gold);color:white;font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px}

.empty{text-align:center;padding:60px 20px;color:#aaa}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty p{font-size:.9rem}

.footer{text-align:center;padding:32px;color:#aaa;font-size:.72rem}
</style>
</head>

<div class="footer">Cellule Performance & Réathlétisation · Toulouse Football Club</div>

<script>
const REPO = '1pierrickbriend-ux/Rapport-TFC-25-jours';
const CAT_COLORS = {
  'N3':'#DC2626','N2':'#991B1B','N1':'#7F1D1D',
  'U19':'#1D4ED8','U18':'#1E40AF','U17':'#1E3A8A','U16':'#1D3461',
  'U23':'#6D28D9','U21':'#7C3AED',
  'CDR':'#B45309','CDF':'#92400E',
  'PRO':'#064E3B','L2':'#065F46',
};
function catColor(c){
  for(const[k,v] of Object.entries(CAT_COLORS)) if(c.toUpperCase().includes(k)) return v;
  return '#374151';
}

async function loadReports(){
  const list = document.getElementById('reports-list');
  try {
    const r = await fetch(
      `https://api.github.com/repos/${REPO}/contents/rapports`,
      {headers:{'Accept':'application/vnd.github.v3+json'}}
    );
    if(!r.ok) throw new Error('Dossier rapports introuvable');
    const files = await r.json();
    const htmlFiles = files.filter(f=>f.name.endsWith('.html'))
                           .sort((a,b)=>{
        function d(n){var m=n.match(/(\d{2})(\d{2})(\d{4})/);return m?m[3]+m[2]+m[1]:'0';}
        return d(b.name).localeCompare(d(a.name));
      });
    if(!htmlFiles.length){
      list.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>Aucun rapport disponible pour le moment.</p></div>';
      return;
    }

    // Lire le manifest si disponible
    let manifest = {};
    try {
      const mr = await fetch(`https://raw.githubusercontent.com/${REPO}/main/manifest.json`);
      if(mr.ok) manifest = await mr.json();
    } catch{}

    list.innerHTML = '';
    htmlFiles.forEach((file, idx) => {
      const info = manifest[file.name] || {};
      const date = info.date || file.name.replace('rapport_','').replace('.html','').replace(/(\d{2})(\d{2})(\d{4})/,'$1/$2/$3');
      const cats = info.categories || [];
      const players = info.players || '';
      const isLatest = idx === 0;
      const url = `https://1pierrickbriend-ux.github.io/Rapport-TFC-25-jours/rapports/${file.name}`;

      const catBadges = cats.map(c=>`<span class="cat-badge" style="background:${catColor(c)}">${c}</span>`).join('');
      const card = document.createElement('a');
      card.className = 'report-card';
      card.href = url;
      card.target = '_blank';
      card.innerHTML = `
        <div class="report-card-inner">
          <div class="report-icon">📋</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="report-date">Entretiens du ${date}</span>
              ${isLatest?'<span class="latest-badge">Dernier rapport</span>':''}
            </div>
            <div class="report-meta">${players ? players+' joueur'+(players>1?'s':'') : ''} ${players&&cats.length?'·':''} ${cats.length?'Catégories :':''}</div>
            ${cats.length?`<div class="report-cats">${catBadges}</div>`:''}
          </div>
          <div class="report-arrow">›</div>
        </div>`;
      list.appendChild(card);
    });
  } catch(e) {
    list.innerHTML = `<div class="error">Impossible de charger les rapports.<br><small>${e.message}</small></div>`;
  }
}
loadReports();
</script>
</body>
</html>
